<!DOCTYPE html>
<html lang="es" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Biblioteca Virtual - Universidad UNIDA</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            unida: { navy: '#1e3c6e', blue: '#2980b9', orange: '#e67e22', dark: '#0f172a' }
          }
        }
      }
    }
  </script>

  <!-- Fuentes e Iconos CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

  <style>
    body { font-family: 'Poppins', sans-serif; }
    .custom-scroll::-webkit-scrollbar { width: 6px; height: 6px; }
    .custom-scroll::-webkit-scrollbar-track { background: transparent; }
    .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    .dark .custom-scroll::-webkit-scrollbar-thumb { background: #334155; }
  </style>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-100 min-h-full flex flex-col antialiased">

  <!-- HEADER -->
  <header class="bg-[#1e3c6e] text-white shadow-md sticky top-0 z-30">
    <div class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between gap-4">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-white/10 flex items-center justify-center text-white text-xl shadow-inner">
          <i class="fas fa-book-reader"></i>
        </div>
        <div>
          <h1 class="font-bold text-base leading-tight tracking-wide">BIBLIOTECA UNIDA</h1>
          <span class="text-[10px] text-blue-200 uppercase tracking-widest font-semibold">Acervo Académico Digital</span>
        </div>
      </div>

      <div class="flex items-center gap-3">
        <a href="admin.html" class="bg-white/10 hover:bg-white/20 text-white text-xs font-semibold px-4 py-2.5 rounded-xl transition flex items-center gap-2">
          <i class="fas fa-lock"></i> Panel Admin
        </a>
        <button onclick="toggleDarkMode()" class="p-2.5 rounded-xl bg-white/10 hover:bg-white/20 text-white transition text-xs">
          <i id="dark-icon" class="fas fa-moon"></i>
        </button>
      </div>
    </div>
  </header>

  <!-- CONTENIDO PRINCIPAL -->
  <main class="flex-1 max-w-7xl w-full mx-auto px-6 py-8 space-y-8">
    
    <!-- BARRA DE BÚSQUEDA Y FILTROS -->
    <section class="bg-white dark:bg-slate-900 p-6 rounded-3xl border border-slate-200 dark:border-slate-800 shadow-sm space-y-4">
      <div class="flex flex-col md:flex-row gap-4 items-center justify-between">
        <div class="relative w-full md:w-96">
          <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-slate-400"><i class="fas fa-search"></i></span>
          <input type="text" id="input-buscador" oninput="filtrarCatalogo()" placeholder="Buscar por título, autor o materia..." class="w-full pl-11 pr-4 py-3 rounded-2xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-xs outline-none focus:ring-2 focus:ring-blue-500 text-slate-800 dark:text-white">
        </div>
        <div class="flex items-center gap-2 w-full md:w-auto overflow-x-auto pb-2 md:pb-0" id="contenedor-filtros-carreras">
          <button onclick="filtrarPorCarrera('')" class="filtro-btn px-4 py-2 rounded-xl text-xs font-bold transition bg-[#1e3c6e] text-white shrink-0">Todas</button>
        </div>
      </div>
    </section>

    <!-- GRILLA DE LIBROS -->
    <section class="space-y-4">
      <div class="flex items-center justify-between">
        <h3 class="text-sm font-bold uppercase tracking-wider text-slate-700 dark:text-slate-300">Catálogo de Materiales</h3>
        <span id="contador-libros" class="text-xs font-semibold text-slate-400">0 volúmenes disponibles</span>
      </div>

      <div id="grilla-libros" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
        <!-- Los libros se inyectan dinámicamente aquí -->
      </div>
    </section>

    <!-- SECCIÓN DE SIMULADORES 3D -->
    <section class="space-y-4 pt-6 border-t border-slate-200 dark:border-slate-800">
      <h3 class="text-sm font-bold uppercase tracking-wider text-slate-700 dark:text-slate-300">Simuladores Educativos 3D</h3>
      <div id="grilla-simuladores" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
        <!-- Simuladores dinámicos -->
      </div>
    </section>

  </main>

  <!-- FOOTER -->
  <footer class="bg-white dark:bg-slate-900 border-t border-slate-200 dark:border-slate-800 py-6 text-center text-xs text-slate-400">
    <p>Universidad UNIDA - Sistema de Biblioteca Digital Centralizada © 2026</p>
  </footer>

  <!-- Carga respaldo local por si no hay conexión a Firebase -->
  <script src="catalogo.js"></script>

  <script>
    const FB_STORAGE_KEY = "unida_firebase_config";
    let db = null;
    let listaLibros = [];
    let listaSimuladores = [];
    let carreraSeleccionada = '';

    function toggleDarkMode() {
      document.documentElement.classList.toggle('dark');
      document.getElementById('dark-icon').className = document.documentElement.classList.contains('dark') ? 'fas fa-sun' : 'fas fa-moon';
    }

    // Inicializar conexión con Firebase usando la misma config del Admin
    function inicializarPublico() {
      const savedConfig = localStorage.getItem(FB_STORAGE_KEY);
      if (!savedConfig) {
        usarDatosLocales();
        return;
      }

      try {
        const config = JSON.parse(savedConfig);
        if (!firebase.apps.length) firebase.initializeApp(config);
        db = firebase.firestore();

        // Escuchar libros en tiempo real
        db.collection("libros").onSnapshot(snapshot => {
          listaLibros = [];
          snapshot.forEach(doc => listaLibros.push(doc.data()));
          if(listaLibros.length === 0 && typeof catalogoLibros !== 'undefined') listaLibros = [...catalogoLibros];
          renderizarCatalogo();
        }, error => { usarDatosLocales(); });

        // Escuchar simuladores en tiempo real
        db.collection("simuladores").onSnapshot(snapshot => {
          listaSimuladores = [];
          snapshot.forEach(doc => listaSimuladores.push(doc.data()));
          if(listaSimuladores.length === 0 && typeof simuladoresGlobales !== 'undefined') listaSimuladores = [...simuladoresGlobales];
          renderizarSimuladores();
        }, error => { renderizarSimuladores(); });

      } catch (e) {
        usarDatosLocales();
      }
    }

    function usarDatosLocales() {
      if (typeof catalogoLibros !== 'undefined') listaLibros = [...catalogoLibros];
      if (typeof simuladoresGlobales !== 'undefined') listaSimuladores = [...simuladoresGlobales];
      renderizarCatalogo();
      renderizarSimuladores();
    }

    function renderizarFiltros() {
      const contenedor = document.getElementById('contenedor-filtros-carreras');
      const carreras = [...new Set(listaLibros.map(l => l.carrera))];
      
      let html = `<button onclick="filtrarPorCarrera('')" class="filtro-btn px-4 py-2 rounded-xl text-xs font-bold transition ${carreraSeleccionada === '' ? 'bg-[#1e3c6e] text-white' : 'bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300'} shrink-0">Todas</button>`;
      
      carreras.forEach(c => {
        html += `<button onclick="filtrarPorCarrera('${c}')" class="filtro-btn px-4 py-2 rounded-xl text-xs font-bold transition ${carreraSeleccionada === c ? 'bg-[#1e3c6e] text-white' : 'bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300'} shrink-0">${c}</button>`;
      });
      contenedor.innerHTML = html;
    }

    function filtrarPorCarrera(carrera) {
      carreraSeleccionada = carrera;
      renderizarFiltros();
      renderizarCatalogo();
    }

    function filtrarCatalogo() {
      renderizarCatalogo();
    }

    function renderizarCatalogo() {
      renderizarFiltros();
      const q = document.getElementById('input-buscador').value.toLowerCase();
      const grilla = document.getElementById('grilla-libros');
      grilla.innerHTML = '';

      const filtrados = listaLibros.filter(l => {
        const matchCarrera = !carreraSeleccionada || l.carrera === carreraSeleccionada;
        const matchTexto = (l.titulo || '').toLowerCase().includes(q) || (l.autor || '').toLowerCase().includes(q);
        return matchCarrera && matchTexto;
      });

      document.getElementById('contador-libros').textContent = `${filtrados.length} volúmenes disponibles`;

      if (filtrados.length === 0) {
        grilla.innerHTML = `<div class="col-span-full py-12 text-center text-slate-400 text-xs">No se encontraron materiales con esos criterios.</div>`;
        return;
      }

      filtrados.forEach(l => {
        grilla.innerHTML += `
          <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-4 shadow-sm flex flex-col justify-between hover:shadow-md transition">
            <div class="space-y-3">
              <div class="relative aspect-[3/4] rounded-xl overflow-hidden bg-slate-100 dark:bg-slate-800 shadow-inner">
                <img src="${l.imagen || 'https://images.unsplash.com/photo-1507842217343-583bb7270b66?auto=format&fit=crop&w=300&q=80'}" class="w-full h-full object-cover">
                <span class="absolute top-2 left-2 px-2.5 py-1 bg-[#1e3c6e]/90 text-white text-[9px] font-bold uppercase rounded-lg backdrop-blur-sm">${l.carrera}</span>
              </div>
              <div>
                <h4 class="text-xs font-bold text-slate-900 dark:text-white uppercase leading-snug line-clamp-2">${l.titulo}</h4>
                <p class="text-[11px] font-medium text-[#2980b9] mt-1 truncate">${l.autor}</p>
              </div>
            </div>
            <div class="pt-4 mt-4 border-t border-slate-100 dark:border-slate-800">
              <a href="${l.link}" target="_blank" class="w-full bg-[#1e3c6e] hover:bg-[#2980b9] text-white text-xs font-bold py-2.5 rounded-xl transition flex items-center justify-center gap-2 shadow-sm">
                <i class="fab fa-google-drive"></i> Acceder al Libro
              </a>
            </div>
          </div>
        `;
      });
    }

    function renderizarSimuladores() {
      const grilla = document.getElementById('grilla-simuladores');
      if(!grilla) return;
      grilla.innerHTML = '';

      if (listaSimuladores.length === 0) {
        grilla.innerHTML = `<div class="col-span-full py-6 text-center text-slate-400 text-xs">No hay simuladores activos.</div>`;
        return;
      }

      listaSimuladores.forEach(s => {
        grilla.innerHTML += `
          <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-6 shadow-sm flex flex-col justify-between">
            <div>
              <span class="text-[10px] font-bold text-amber-600 uppercase tracking-widest">${s.facultad}</span>
              <h4 class="text-sm font-bold text-slate-900 dark:text-white mt-1">${s.titulo}</h4>
              <p class="text-xs text-slate-500 mt-1">${s.autor}</p>
            </div>
            <div class="pt-4 mt-4 border-t border-slate-100 dark:border-slate-800">
              <a href="${s.link}" target="_blank" class="w-full bg-[#e67e22] hover:bg-[#d35400] text-white text-xs font-bold py-2.5 rounded-xl transition flex items-center justify-center gap-2 shadow-sm">
                <i class="fas fa-vr-cardboard"></i> Iniciar Simulador
              </a>
            </div>
          </div>
        `;
      });
    }

    // Arranque inicial
    inicializarPublico();
  </script>
</body>
</html>
