<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Biblioteca Virtual - UNIDA</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex flex-col">

  <!-- HEADER ORIGINAL -->
  <header class="bg-[#1e3c6e] text-white shadow">
    <div class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">
      <h1 class="font-bold text-lg tracking-wider">BIBLIOTECA DIGITAL UNIDA</h1>
      <div class="flex items-center gap-4">
        <a href="admin.html" class="bg-white/10 hover:bg-white/20 text-white text-xs font-semibold px-4 py-2 rounded-xl transition">
          <i class="fas fa-lock mr-1"></i> Panel Admin
        </a>
      </div>
    </div>
  </header>

  <!-- CONTENIDO -->
  <main class="flex-1 max-w-7xl w-full mx-auto px-6 py-8 space-y-6">
    <div class="flex flex-col sm:flex-row gap-4 items-center justify-between bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
      <input type="text" id="buscador-publico" oninput="renderizarCatalogoPublico()" placeholder="Buscar libro por título o autor..." class="w-full sm:w-96 px-4 py-2.5 rounded-xl border border-slate-300 text-xs outline-none focus:ring-2 focus:ring-blue-500">
      <span id="info-total-libros" class="text-xs font-bold text-slate-500">Cargando acervo...</span>
    </div>

    <!-- GRILLA DE LIBROS -->
    <div id="grilla-libros-publica" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
      <!-- Los libros se cargan aquí en tiempo real -->
    </div>
  </main>

  <!-- FOOTER -->
  <footer class="bg-white border-t border-slate-200 py-4 text-center text-xs text-slate-400">
    Biblioteca UNIDA © 2026 - Conectado a la Nube
  </footer>

  <!-- Archivo local de respaldo -->
  <script src="catalogo.js"></script>

  <script>
    const FB_STORAGE_KEY = "unida_firebase_config";
    let db = null;
    let librosCloud = [];

    function conectarFirebasePublico() {
      const savedConfig = localStorage.getItem(FB_STORAGE_KEY);
      if (!savedConfig) {
        usarRespaldoLocal();
        return;
      }

      try {
        const config = JSON.parse(savedConfig);
        if (!firebase.apps.length) firebase.initializeApp(config);
        db = firebase.firestore();

        // Escucha en tiempo real de Firestore
        db.collection("libros").onSnapshot(snapshot => {
          librosCloud = [];
          snapshot.forEach(doc => librosCloud.push(doc.data()));
          if (librosCloud.length === 0 && typeof catalogoLibros !== 'undefined') {
            librosCloud = [...catalogoLibros];
          }
          renderizarCatalogoPublico();
        }, error => {
          usarRespaldoLocal();
        });

      } catch (e) {
        usarRespaldoLocal();
      }
    }

    function usarRespaldoLocal() {
      if (typeof catalogoLibros !== 'undefined') {
        librosCloud = [...catalogoLibros];
      }
      renderizarCatalogoPublico();
    }

    function renderizarCatalogoPublico() {
      const q = (document.getElementById('buscador-publico').value || '').toLowerCase();
      const contenedor = document.getElementById('grilla-libros-publica');
      contenedor.innerHTML = '';

      const filtrados = librosCloud.filter(l => 
        (l.titulo || '').toLowerCase().includes(q) || (l.autor || '').toLowerCase().includes(q)
      );

      document.getElementById('info-total-libros').textContent = `${filtrados.length} libros disponibles`;

      if (filtrados.length === 0) {
        contenedor.innerHTML = `<div class="col-span-full py-12 text-center text-slate-400 text-xs">No se encontraron materiales.</div>`;
        return;
      }

      filtrados.forEach(l => {
        contenedor.innerHTML += `
          <div class="bg-white border border-slate-200 rounded-2xl p-4 shadow-sm flex flex-col justify-between">
            <div>
              <img src="${l.imagen || 'https://images.unsplash.com/photo-1507842217343-583bb7270b66?auto=format&fit=crop&w=300&q=80'}" class="w-full h-48 object-cover rounded-xl shadow-inner bg-slate-100 mb-3">
              <span class="text-[9px] font-bold text-[#2980b9] uppercase tracking-wider">${l.carrera}</span>
              <h4 class="text-xs font-bold text-slate-800 uppercase line-clamp-2 mt-0.5">${l.titulo}</h4>
              <p class="text-[11px] text-slate-500 mt-1 truncate">${l.autor}</p>
            </div>
            <div class="mt-4 pt-3 border-t border-slate-100">
              <a href="${l.link}" target="_blank" class="w-full bg-[#1e3c6e] hover:bg-[#2980b9] text-white text-xs font-bold py-2 rounded-xl transition flex items-center justify-center gap-1.5 shadow-sm">
                <i class="fab fa-google-drive"></i> Descargar / Ver
              </a>
            </div>
          </div>
        `;
      });
    }

    // Inicializar lectura en vivo
    conectarFirebasePublico();
  </script>
</body>
</html>
